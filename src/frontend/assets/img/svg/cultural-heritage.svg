<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 24" width="132" height="24" role="img" aria-label="Cultural Heritage">
  <!-- Designation badge from the previous DNMM website (image_global/Cultural.png), redrawn as
       vector in the logo colours. textLength keeps the width fixed whatever
       sans-serif font the viewer has. -->
  <rect width="132" height="24" rx="3" fill="#E28E2C"/>
  <text x="66" y="16.5" text-anchor="middle" textLength="114" lengthAdjust="spacingAndGlyphs"
        font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0E">Cultural Heritage</text>
</svg>
